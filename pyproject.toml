[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nepal-gov-agent"
version = "0.4.0"
description = "Reference implementation: agentic RAG on Nepal government policy and legal documents. Offline-capable, Nepali + English, hybrid retrieval with citations."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Irfan Ali", email = "irfanali29@hotmail.com" }]
keywords = ["nepal", "government", "rag", "agentic-ai", "llm", "offline", "nepali"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: Nepali",
]

dependencies = [
    "ragnav>=0.3.0",
    "ragfallback>=2.0.2",
    "agentensemble>=0.3.0",
    "pymupdf>=1.26.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "black>=24.0.0", "ruff>=0.6.0", "python-dotenv>=1.0.1"]
# Ollama runs separately on the host; this extra is a marker for docs / tooling.
ollama = []
mistral = [
    "mistralai>=1.9.0",
    "python-dotenv>=1.0.1",
]
# Synthetic eval generation — needs OpenAI client.
eval = ["openai>=1.40.0", "python-dotenv>=1.0.1"]
# Gradio demo (nepalgov.datacortex.in).
# Pin <5: Gradio 6 breaks tab clicks and moves theme to launch(); v0.4 demo targets 4.x.
demo = ["gradio>=4.44.0,<5.0.0"]

[project.scripts]
nepal-gov-agent = "nepal_gov_agent.cli:main"

[project.urls]
Homepage = "https://github.com/irfanalidv/Nepal-Gov-Agent"
Repository = "https://github.com/irfanalidv/Nepal-Gov-Agent"

[tool.setuptools.packages.find]
where = ["."]
include = ["nepal_gov_agent*"]

[tool.setuptools.package-data]
nepal_gov_agent = ["py.typed"]

# Shipped beside the package so `benchmark --synthetic` works after pip install.
[tool.setuptools.data-files]
eval_data = ["eval_data/README.md", "eval_data/synthetic_qa_v1.jsonl"]
