[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nepal-gov-agent"
version = "0.6.0"
description = "Reference implementation: agentic RAG on Nepal government policy and legal documents. Offline-capable, Nepali + English, hybrid retrieval with citations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Irfan Ali", email = "irfanali29@hotmail.com" }]
keywords = [
    "nepal",
    "nepali",
    "government",
    "policy",
    "legal-documents",
    "rag",
    "agentic-ai",
    "llm",
    "offline",
    "hybrid-search",
    "bm25",
    "multilingual",
    "devanagari",
    "citations",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Natural Language :: Nepali",
    "Natural Language :: English",
    "Typing :: Typed",
]

dependencies = [
    "ragnav>=0.5.1",
    "ragfallback>=2.0.2",
    "agentensemble>=0.3.0",
    "pymupdf>=1.26.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "types-requests",
    "pre-commit>=3.5",
    "build>=1.2.0",
    "twine>=5.0.0",
    "python-dotenv>=1.0.1",
]
# Ollama runs separately on the host; this extra is a marker for docs / tooling.
ollama = []
mistral = [
    "mistralai>=1.9.0",
    "python-dotenv>=1.0.1",
]
# Synthetic eval generation — needs OpenAI client.
eval = ["openai>=1.40.0", "python-dotenv>=1.0.1"]
# Gradio demo (local dev only).
# Pin <5: Gradio 6 breaks tab clicks and moves theme to launch(); v0.4 demo targets 4.x.
demo = ["gradio>=4.44.0,<5.0.0"]
# FastAPI frontend for nepalgov.datacortex.in on Render.
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
]

[project.scripts]
nepal-gov-agent = "nepal_gov_agent.cli:main"

[project.urls]
Homepage = "https://github.com/irfanalidv/Nepal-Gov-Agent"
Documentation = "https://github.com/irfanalidv/Nepal-Gov-Agent#readme"
Repository = "https://github.com/irfanalidv/Nepal-Gov-Agent"
Issues = "https://github.com/irfanalidv/Nepal-Gov-Agent/issues"
Changelog = "https://github.com/irfanalidv/Nepal-Gov-Agent/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["nepal_gov_agent*"]

[tool.setuptools.package-data]
nepal_gov_agent = ["py.typed"]

# Shipped beside the package so `benchmark --synthetic` works after pip install.
[tool.setuptools.data-files]
eval_data = ["eval_data/README.md", "eval_data/synthetic_qa_v1.jsonl"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PTH", "RET", "PIE"]
ignore = [
    "B008",    # FastAPI-style default calls are idiomatic in web/ and demo/
    "RUF001",  # Devanagari text in strings is intentional
    "RUF002",  # ...and in docstrings
    "RUF003",  # ...and in comments
]

[tool.ruff.lint.per-file-ignores]
# Examples, demo and web set up logging / sys.path before importing the package.
"examples/*.py" = ["E402"]
"demo/*.py" = ["E402"]
"web/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["nepal_gov_agent"]
branch = false

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
